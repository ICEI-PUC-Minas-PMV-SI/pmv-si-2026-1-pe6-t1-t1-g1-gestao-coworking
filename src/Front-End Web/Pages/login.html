<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axis Working - Entrar</title>
  <style>
    :root {
      --navy: #0A2A47;
      --blue: #5D7893;
      --line: #E5E5E5;
      --muted: #878787;
      --ink: #101010;
      --white: #FFFFFF;
      --danger: #8A3A3A;
      --success: #3F6B4D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--navy);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .top {
      height: 74px;
      display: flex;
      align-items: center;
      padding-left: 9%;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .logo { width: 72px; height: 46px; color: var(--navy); }

    .stage {
      min-height: calc(100vh - 74px);
      display: grid;
      place-items: center;
      padding: 46px 20px;
    }

    .card {
      width: min(490px, 100%);
      min-height: 548px;
      padding: 48px 34px 40px;
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 42px;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
    }

    .field { margin-bottom: 32px; }

    input {
      width: 100%;
      height: 58px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 0 24px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 20px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
      outline: none;
    }

    input::placeholder { color: #9A9A9A; }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(93, 120, 147, 0.16);
    }

    button {
      width: 100%;
      height: 58px;
      margin-top: 14px;
      border: none;
      border-radius: 20px;
      background: var(--navy);
      color: var(--white);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
    }

    button:disabled { opacity: .65; cursor: wait; }

    .register {
      margin-top: 54px;
      text-align: center;
      color: #333;
      font-size: 20px;
    }

    .register a { color: inherit; text-decoration: none; font-weight: 700; }

    .message {
      min-height: 20px;
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .message.success { color: var(--success); }
    .message.error { color: var(--danger); }

    @media (max-width: 640px) {
      .top { padding-left: 28px; }
      .card { min-height: auto; padding: 34px 24px; }
      h1 { margin-bottom: 30px; }
      input, button { height: 52px; font-size: 16px; }
      .register { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 64 50" aria-label="Axis Working">
      <path d="M2 48 L18 4 L26 4 L32 22 L38 4 L46 4 L62 48 L52 48 L42 22 L36 38 L32 28 L28 38 L22 22 L12 48 Z" fill="currentColor"/>
    </svg>
  </header>

  <main class="stage">
    <section class="card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Entrar</h1>
      <form id="loginForm">
        <div class="field">
          <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="username" placeholder="Usuário" required />
        </div>
        <div class="field">
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Senha" required />
        </div>
        <button id="loginButton" type="submit">ENTRAR</button>
        <div id="message" class="message"></div>
      </form>
      <p class="register">Novo na Axis Working? <a href="cadastro.html">Cadastrar</a></p>
    </section>
  </main>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8001/api';
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const button = document.getElementById('loginButton');

    function setMessage(text, type = '') {
      message.textContent = text;
      message.className = `message ${type}`.trim();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
      const senha = document.getElementById('senha').value;

      button.disabled = true;
      setMessage('Realizando login...');

      try {
        const response = await fetch(`${API_BASE_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpf, senha }),
        });
        const data = await response.json();

        if (!response.ok) {
          setMessage(data.detail || 'CPF ou senha inválidos.', 'error');
          return;
        }

        const clientesResponse = await fetch(`${API_BASE_URL}/clientes`, {
          headers: { Authorization: `${data.token_type || 'bearer'} ${data.access_token}` },
        });
        const clientes = clientesResponse.ok ? await clientesResponse.json() : [];
        const cliente = clientes.find((item) => item.cpf === cpf);

        if (!cliente) {
          setMessage('Login feito, mas o cliente não foi localizado.', 'error');
          return;
        }

        localStorage.setItem('axisAuth', JSON.stringify({
          token: data.access_token,
          tokenType: data.token_type || 'bearer',
          cliente,
        }));

        setMessage('Login realizado. Redirecionando...', 'success');
        window.location.href = 'gerenciamento-conta.html';
      } catch (error) {
        console.error(error);
        setMessage('Erro ao conectar com o servidor.', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
