<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos - Axis Working</title>
  <link rel="stylesheet" href="../css/planos.css">
</head>
<body>
  <nav>
    <div class="logo">
      <img src="../img/logo.png" alt="Axis Working">
      <h1>Axis Working</h1>
    </div>

    <div class="menu">
      <a href="index.html">Home</a>
      <a href="salas.html">Info Salas</a>
      <a href="sobrenos.html">Sobre nós</a>
    </div>

    <button class="btn-nav" onclick="location.href='login.html'">ENTRAR</button>
  </nav>

  <section class="titulo">
    <h2>PLANOS</h2>
  </section>

  <section class="cards" id="planosList">
    <p>Carregando planos...</p>
  </section>

  <footer>
    <div class="footer-container">
      <div class="footer-logo">
        <img src="../img/logo.png" alt="Logo">
        <h2>Axis Working</h2>
        <p>Transformando seu jeito de trabalhar com foco e inovação.</p>
      </div>

      <div class="footer-contato">
        <h3>Contato</h3>
        <p>Email: contato@axisworking.com</p>
        <p>Telefone: (11) 9999-9999</p>
        <p>Endereço: Av. Paulista, 1000 - SP</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Axis Working. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8001/api';
    const imagens = ['../img/diario.png', '../img/semanal.png', '../img/mensal.png', '../img/anual.png'];

    function preco(value) {
      return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function lista(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.value)) return data.value;
      return [];
    }

    function escolherPlano(idPlano) {
      if (!localStorage.getItem('axisAuth') && !localStorage.getItem('token_acesso')) {
        window.location.href = 'login.html';
        return;
      }
      window.location.href = `carrinho.html?plano=${encodeURIComponent(idPlano)}`;
    }

    async function carregarPlanos() {
      const container = document.getElementById('planosList');
      try {
        const response = await fetch(`${API_BASE_URL}/planos`);
        if (!response.ok) throw new Error(`Erro ${response.status}`);
        const planos = lista(await response.json());

        container.innerHTML = planos.map((plano, index) => `
          <div class="card">
            <div class="marca-fundo">
              <img src="../img/logo.png" alt="">
            </div>
            <div class="carousel">
              <img src="${imagens[index % imagens.length]}" class="active" alt="${plano.nome}">
            </div>
            <div class="card-info">
              <h3>${plano.nome}</h3>
              <p>Acesso: ${plano.acesso}</p>
              <ul>
                <li>Internet de alta velocidade</li>
                <li>Ambiente climatizado</li>
                <li>Suporte da equipe Axis Working</li>
              </ul>
              <div class="preco">${preco(plano.preco)}</div>
              <button class="btn" onclick="escolherPlano(${plano.id_plano})">Escolher Plano</button>
            </div>
          </div>
        `).join('') || '<p>Nenhum plano encontrado.</p>';
      } catch (error) {
        console.error(error);
        container.innerHTML = '<p>Não foi possível carregar os planos no momento.</p>';
      }
    }

    carregarPlanos();
  </script>
</body>
</html>
