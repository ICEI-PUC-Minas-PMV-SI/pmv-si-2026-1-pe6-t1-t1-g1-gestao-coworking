<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Salas - Axis Working</title>
  <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/salas.css">
    <link rel="stylesheet" href="../css/headerFooter.css">
</head>
<body>
  <header>
        <div id="logo" onclick="window.location.href = 'index.html'">
            <img src="../img/logoaxis.png" alt="">
            <p>Axis Work</p>
        </div>
        <div class="hyperlinks-header">
            <a href="salas.html">Salas</a>
            <a href="planos.html">Planos</a>
            <a href="sobrenos.html">Sobre Nós</a>
        </div>
        <div>
            <button class="bot2 bot" onclick="window.location.href = 'cadastro.html'">Cadastrar</button>
            <button class="bot1 bot" onclick="window.location.href = 'login.html'">Entrar</button>
        </div>
    </header>

  <main>
    <div class="container">
      <h2>Info Salas</h2>
      <div class="top-cards">
        <div id="privado" class="top-card" onclick="goTipo('privado')">
          <img src="../img/individual.jpeg" alt="Espaço privativo">
          <p>Espaço privativo</p>
        </div>
        <div id="compartilhado" class="top-card" onclick="goTipo('compartilhado')">
          <img src="../img/compartilhada.jpeg" alt="Mesa compartilhada">
          <p>Mesa compartilhada</p>
        </div>
        <div id="fixa" class="top-card" onclick="goTipo('fixa')">
          <img src="../img/fixa.jpeg" alt="Estação fixa">
          <p>Estação fixa</p>
        </div>
        <div id="reuniao" class="top-card" onclick="goTipo('reuniao')">
          <img src="../img/reuniao.jpeg" alt="Sala de reunião">
          <p>Sala de reunião</p>
        </div>
      </div>
    </div>

    <div class="container">
      <h2>Escolha de sala</h2>
      <div class="grid" id="lista"></div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/salas.js"></script>
</body>
</html>
