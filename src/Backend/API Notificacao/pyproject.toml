[project]
name = "notificacoes-api"
version = "0.1.0"
description = "API de notificacoes gerada por engenharia reversa a partir de uma collection Postman."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
